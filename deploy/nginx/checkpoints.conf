# nginx site for the unified app. Template: scripts/deploy/nginx-setup.sh fills
# @HOST@ @PORT@ @PROJECT@ @FLAG@ @HTML@ @LISTEN_HTTP2@ @HTTP2_DIRECTIVE@ and
# installs it as /etc/nginx/sites-available/@HOST@.conf.
#
# The three old hosts answer with a permanent redirect to their language path
# on the new host, keeping the rest of the URL.

server {
  listen 80;
  listen [::]:80;
  server_name @HOST@;
  location /.well-known/acme-challenge/ { root /var/www/html; }
  location / { return 301 https://$host$request_uri; }
}

# LEGACY-BEGIN (dropped when LEGACY_REDIRECT=0)
# Old hosts, plain HTTP: ACME (for their own certificate) and the redirect.
server {
  listen 80;
  listen [::]:80;
  server_name go-checkpoints.appsyss.com js-checkpoints.appsyss.com rust-checkpoints.appsyss.com;
  location /.well-known/acme-challenge/ { root /var/www/html; }
  location / { return 301 https://@HOST@/$cp_lang$request_uri; }
}

# Old hosts, HTTPS. Needs a certificate covering the three names
# (certbot -d go-checkpoints... -d js-checkpoints... -d rust-checkpoints..., cert name checkpoints-legacy).
server {
  listen 443 ssl@LISTEN_HTTP2@;
  listen [::]:443 ssl@LISTEN_HTTP2@;
@HTTP2_DIRECTIVE@
  server_name go-checkpoints.appsyss.com js-checkpoints.appsyss.com rust-checkpoints.appsyss.com;
  ssl_certificate     /etc/letsencrypt/live/checkpoints-legacy/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/checkpoints-legacy/privkey.pem;
  return 301 https://@HOST@/$cp_lang$request_uri;
}
# LEGACY-END

server {
  listen 443 ssl@LISTEN_HTTP2@;
  listen [::]:443 ssl@LISTEN_HTTP2@;
@HTTP2_DIRECTIVE@
  server_name @HOST@;

  ssl_certificate     /etc/letsencrypt/live/@HOST@/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/@HOST@/privkey.pem;

  add_header X-Frame-Options SAMEORIGIN always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  client_max_body_size 2m;

  error_page 503 /__cp_maintenance__;
  location = /__cp_maintenance__ {
    internal;
    alias @HTML@;
    default_type text/html;
  }

  # WebSockets: /ws/runs/:id (run output) and /ws/terminal (Rust PTY).
  # Long timeouts: an idle socket must not be cut at nginx's default 60 s.
  location /ws/ {
    if (-f @FLAG@) { return 503; }
    proxy_pass http://127.0.0.1:@PORT@;
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host       $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location /api/ {
    if (-f @FLAG@) { return 503; }
    proxy_pass http://127.0.0.1:@PORT@;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 180s;
  }

  location = /healthz {
    proxy_pass http://127.0.0.1:@PORT@;
    proxy_set_header Host $host;
  }

  # The SPA, which routes /go, /js, /rust itself.
  location / {
    if (-f @FLAG@) { return 503; }
    root @PROJECT@/web/dist;
    try_files $uri $uri/ /index.html;
  }
}
