# http-level map (installed to /etc/nginx/conf.d/checkpoints-map.conf):
# old host -> language path used by the 301 redirects in checkpoints.conf.
map $host $cp_lang {
  go-checkpoints.appsyss.com   go;
  js-checkpoints.appsyss.com   js;
  rust-checkpoints.appsyss.com rust;
  default                      "";
}
