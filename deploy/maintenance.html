<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="refresh" content="30" />
    <title>Checkpoints — back shortly</title>
    <!-- Self-contained on purpose: nginx serves this while the app is down, so
         no fonts, images or scripts from anywhere else. The 3D server room is
         drawn with CSS perspective. -->
    <style>
      :root { --bg:#060a12; --text:#e6edf7; --muted:#9fb0c9; --accent:#4f8cff; --ok:#3fd68f; }
      * { box-sizing:border-box; }
      html, body { margin:0; height:100%; }
      body {
        background:
          radial-gradient(ellipse 80% 55% at 50% 100%, rgba(79,140,255,.28), transparent 70%),
          radial-gradient(ellipse 60% 40% at 50% 0%, rgba(63,214,143,.10), transparent 70%),
          var(--bg);
        color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
        overflow:hidden;
      }

      /* ── the room: floor grid and two rows of racks in perspective ── */
      .scene { position:fixed; inset:0; perspective:900px; perspective-origin:50% 38%; pointer-events:none; }
      .floor {
        position:absolute; left:-50%; right:-50%; bottom:-10%; height:90%;
        transform-origin:50% 100%; transform:rotateX(78deg);
        background:
          linear-gradient(rgba(79,140,255,.35) 1px, transparent 1px) 0 0/80px 80px,
          linear-gradient(90deg, rgba(79,140,255,.35) 1px, transparent 1px) 0 0/80px 80px;
        mask-image:linear-gradient(to top, #000 10%, transparent 85%);
        -webkit-mask-image:linear-gradient(to top, #000 10%, transparent 85%);
        animation:drift 6s linear infinite;
      }
      @keyframes drift { to { background-position:0 80px, 0 0; } }

      .row { position:absolute; top:22%; bottom:18%; width:34%; transform-style:preserve-3d; }
      .row.left  { left:-4%;  transform:rotateY(58deg);  transform-origin:0 50%; }
      .row.right { right:-4%; transform:rotateY(-58deg); transform-origin:100% 50%; }
      .rack {
        position:absolute; top:0; bottom:0; width:23%;
        background:linear-gradient(180deg,#1a2335,#0e1522 60%,#0a0f19);
        border:1px solid #2a3650; border-radius:4px;
        box-shadow:inset 0 0 0 4px #0b111c, 0 30px 60px rgba(0,0,0,.6);
        display:flex; flex-direction:column; gap:6px; padding:12px 8px;
      }
      .rack:nth-child(1){left:0} .rack:nth-child(2){left:25.5%} .rack:nth-child(3){left:51%} .rack:nth-child(4){left:76.5%}
      .unit {
        flex:1; border-radius:2px; position:relative;
        background:linear-gradient(180deg,#202b40,#151d2c);
        border-top:1px solid #34425f;
      }
      .unit::before, .unit::after {
        content:""; position:absolute; top:50%; width:5px; height:5px; border-radius:50%;
        transform:translateY(-50%); background:var(--ok); box-shadow:0 0 8px var(--ok);
        animation:blink 1.6s steps(2,start) infinite;
      }
      .unit::before { right:10px; }
      .unit::after  { right:20px; background:var(--accent); box-shadow:0 0 8px var(--accent); animation-duration:2.3s; }
      .unit:nth-child(3n)::before { animation-delay:.4s; }
      .unit:nth-child(4n)::after  { animation-delay:.9s; }
      .unit:nth-child(5n)::before { background:#ffb547; box-shadow:0 0 8px #ffb547; }
      @keyframes blink { to { opacity:.25; } }

      /* light beam down the aisle */
      .beam {
        position:absolute; left:50%; top:10%; width:40%; height:80%; transform:translateX(-50%);
        background:radial-gradient(ellipse 50% 60% at 50% 40%, rgba(79,140,255,.18), transparent 70%);
        filter:blur(10px);
      }

      /* ── the card ── */
      main {
        position:relative; z-index:1; height:100%; display:grid; place-items:center; padding:16px;
      }
      .card {
        max-width:30rem; width:100%; text-align:center; padding:2rem 2rem 1.8rem;
        background:rgba(12,18,30,.62); border:1px solid rgba(120,150,200,.22); border-radius:16px;
        backdrop-filter:blur(14px) saturate(140%); -webkit-backdrop-filter:blur(14px) saturate(140%);
        box-shadow:0 20px 60px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.06);
      }
      .spinner {
        width:44px; height:44px; margin:0 auto 1rem; border-radius:50%;
        border:3px solid rgba(79,140,255,.2); border-top-color:var(--accent); border-right-color:var(--ok);
        animation:spin 1.1s linear infinite;
      }
      @keyframes spin { to { transform:rotate(360deg); } }
      h1 { font-size:1.45rem; margin:0 0 .55rem; letter-spacing:.01em; }
      p { color:var(--muted); line-height:1.6; margin:0; }
      .small { margin-top:1rem; font-size:.8rem; color:#7d8ca6; }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; } }
      @media (max-width:640px) { .row { width:44%; } }
    </style>
  </head>
  <body>
    <div class="scene" aria-hidden="true">
      <div class="beam"></div>
      <div class="row left">
        <div class="rack"><i class="unit"></i><i class="unit"></i><i class="unit"></i><i class="unit"></i><i class="unit"></i><i class="unit"></i><i class="unit"></i><i class="unit"></i><i class="unit"></i><i class="unit"></i></div>
        <div class="rack"><i class="unit"></i><i class="unit"></i><i class="unit"></i><i class="unit"></i><i class="unit"></i><i class="unit"></i><i class="unit"></i><i class="unit"></i><i class="unit"></i><i class="unit"></i></div>
        <div class="rack"><i class="unit"></i><i class="unit"></i><i class="unit"></i><i class="unit"></i><i class="unit"></i><i class="unit"></i><i class="unit"></i><i class="unit"></i><i class="unit"></i><i class="unit"></i></div>
        <div class="rack"><i class="unit"></i><i class="unit"></i><i class="unit"></i><i class="unit"></i><i class="unit"></i><i class="unit"></i><i class="unit"></i><i class="unit"></i><i class="unit"></i><i class="unit"></i></div>
      </div>
      <div class="row right">
        <div class="rack"><i class="unit"></i><i class="unit"></i><i class="unit"></i><i class="unit"></i><i class="unit"></i><i class="unit"></i><i class="unit"></i><i class="unit"></i><i class="unit"></i><i class="unit"></i></div>
        <div class="rack"><i class="unit"></i><i class="unit"></i><i class="unit"></i><i class="unit"></i><i class="unit"></i><i class="unit"></i><i class="unit"></i><i class="unit"></i><i class="unit"></i><i class="unit"></i></div>
        <div class="rack"><i class="unit"></i><i class="unit"></i><i class="unit"></i><i class="unit"></i><i class="unit"></i><i class="unit"></i><i class="unit"></i><i class="unit"></i><i class="unit"></i><i class="unit"></i></div>
        <div class="rack"><i class="unit"></i><i class="unit"></i><i class="unit"></i><i class="unit"></i><i class="unit"></i><i class="unit"></i><i class="unit"></i><i class="unit"></i><i class="unit"></i><i class="unit"></i></div>
      </div>
      <div class="floor"></div>
    </div>
    <main>
      <div class="card">
        <div class="spinner" aria-hidden="true"></div>
        <h1>Back shortly</h1>
        <p>The server is being updated. Your saved work is untouched — this takes a minute or two.</p>
        <p class="small">This page refreshes by itself.</p>
      </div>
    </main>
  </body>
</html>
